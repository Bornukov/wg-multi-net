# =========================================================
# Портал: https://__PORTAL_DOMAIN__ (Basic Auth)
# =========================================================
server {
    listen 80;
    server_name __PORTAL_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __PORTAL_DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    location /api/ {
        auth_basic "VPN Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic "VPN Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /opt/wg-portal;
        index index.html;
    }
}

# =========================================================
# Сеть 1 → https://__NET1_DOMAIN__ → 127.0.0.1:8443
# (без Basic Auth — вход только через wg-access-server)
# =========================================================
server {
    listen 80;
    server_name __NET1_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __NET1_DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    location / {
        proxy_pass https://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}

